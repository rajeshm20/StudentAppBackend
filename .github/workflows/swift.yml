# Replaces .github/workflows/swift.yml and .github/workflows/docker-publish.yml
# Test job must pass before the Docker image is built and pushed to GHCR.
name: CI/CD

on:
  push:
    branches: ["main", "feature/postgres-migration", "feature/postgres*", "postgres-trial"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "feature/postgres-migration", "feature/postgres*", "postgres-trial"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/studentappbackend

jobs:
  test:
    name: Build & Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres]
    
    container:
      image: swift:6.0-noble
      
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studentapp
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-db-password-placeholder' }}
          POSTGRES_DB: student_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U studentapp -d student_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    env:
      DB_DRIVER: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: studentapp
      DATABASE_NAME: student_db
      DATABASE_TLS_MODE: disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secure Environment Variables
        run: |
          # Inject secrets securely, with ephemeral fallbacks for untrusted PR forks
          DB_PASS="${{ secrets.CI_DB_PASSWORD }}"
          if [ -z "$DB_PASS" ]; then DB_PASS='ci-db-password-placeholder'; fi
          echo "::add-mask::$DB_PASS"
          echo "DATABASE_PASSWORD=$DB_PASS" >> $GITHUB_ENV
          
          JWT="${{ secrets.JWT_SECRET }}"
          if [ -z "$JWT" ]; then JWT=$(openssl rand -base64 32); fi
          echo "::add-mask::$JWT"
          echo "JWT_SECRET=$JWT" >> $GITHUB_ENV

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swift-build-${{ runner.os }}-

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

  docker-build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Publish Docker Image
    needs: docker-build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
