services:
  migrate:
    image: ghcr.io/rajeshm20/openedcore:latest
    restart: "no"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DRIVER: ${DATABASE_DRIVER:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-student_db}
      DATABASE_USER: ${DATABASE_USER:-studentapp}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN is required}
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--yes"]

  app:
    image: ghcr.io/rajeshm20/openedcore:latest
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_DRIVER: ${DATABASE_DRIVER:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-student_db}
      DATABASE_USER: ${DATABASE_USER:-studentapp}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN is required}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@openedschool.com}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: ["serve", "--env", "development", "--hostname", "0.0.0.0", "--port", "8080"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-studentapp}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:-student_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-studentapp} -d ${DATABASE_NAME:-student_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
